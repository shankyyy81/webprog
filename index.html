
<!DOCTYPE html>
<html>
<head>
    <title>Simplified Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Payment Form</h2>
    <form id="myForm">
        <label>Name:</label>
        <input type="text" id="name"> 
        <span id="err-name" class="err"></span>
        <label>Credit Card:</label>
        <input type="text" id="cc" maxlength="16"> 
        <span id="err-cc" class="err"></span>
        <label>CVV:</label>
        <input type="text" id="cvv" maxlength="3"> 
        <span id="err-cvv" class="err"></span>
        <label>Expiry Date:</label>
        <select id="m"></select> <select id="y"></select> 
        <span id="err-exp" class="err"></span>
        <button type="submit">Submit</button>
    </form>
    
    <script src="script.js"></script>
</body>
</html>
